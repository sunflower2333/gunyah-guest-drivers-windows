name: Build Vulkan validation tools (ARM64)

# Builds vkcube and vulkaninfo natively for Windows ARM64 so the DroidVM
# Native Context Turnip ICD can be validated with the standard Khronos tools
# rather than only with project-local probes.  Manual dispatch only: this does
# not build any driver and is not part of the driver gates.

on:
  # workflow_dispatch alone would need this file on the default branch to be
  # registered, and this is a validation-tools build that should not touch it.
  # A path-scoped push trigger fires from the working branch instead.
  workflow_dispatch:
    inputs:
      tools_ref:
        description: Vulkan-Tools tag or branch to build
        required: false
        default: v1.4.313
  push:
    branches:
      - viogpu-wddm3.1
    paths:
      - ".github/workflows/build-vulkan-tools-arm64.yml"

permissions:
  contents: read

jobs:
  build:
    name: vkcube + vulkaninfo (native ARM64)
    runs-on: windows-11-arm

    steps:
      - name: Check out Vulkan-Tools
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Tools
          ref: ${{ inputs.tools_ref || 'v1.4.313' }}
          path: Vulkan-Tools
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Identify Vulkan-Tools source revision
        id: tools_identity
        shell: pwsh
        working-directory: Vulkan-Tools
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha.Length -ne 40) {
            throw "Unable to identify the checked out Vulkan-Tools revision"
          }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "image=$env:ImageOS-$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Vulkan-Tools source: $sha"

      # UPDATE_DEPS writes to external/Release/64, not build/_deps.  Restore
      # the main CMake tree too: its UPDATE_DEPS_HASH suppresses the initial
      # --clean-build/--clean-install that would erase restored dependencies.
      # The exact source and runner image isolate CMake and compiler state.
      # Third-party installed libraries are build dependencies, not the final
      # Vulkan-Tools validation binaries uploaded below.
      - name: Cache Vulkan-Tools dependency and build trees
        id: tools_cache
        uses: actions/cache@v4
        with:
          path: |
            Vulkan-Tools/external/Release/64
            Vulkan-Tools/build
          key: vulkan-tools-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools_identity.outputs.image }}-${{ steps.tools_identity.outputs.sha }}-release

      - name: Report restored build cache
        shell: pwsh
        run: |
          $dirs = @('Vulkan-Tools/external/Release/64', 'Vulkan-Tools/build')
          foreach ($dir in $dirs) {
            $files = @(Get-ChildItem -LiteralPath $dir -Recurse -File -ErrorAction SilentlyContinue)
            $bytes = ($files | Measure-Object -Property Length -Sum).Sum
            Write-Host ("Restored {0}: {1} files, {2:N0} bytes" -f $dir, $files.Count, $bytes)
          }
          Write-Host "Exact cache hit: ${{ steps.tools_cache.outputs.cache-hit }}"

      - name: Configure
        shell: pwsh
        working-directory: Vulkan-Tools
        run: |
          cmake -S . -B build `
            -D UPDATE_DEPS=ON `
            -D UPDATE_DEPS_SKIP_EXISTING_INSTALL=ON `
            -D CMAKE_BUILD_TYPE=Release `
            -D BUILD_CUBE=ON `
            -D BUILD_VULKANINFO=ON `
            -D BUILD_ICD=OFF `
            -D BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build
        shell: pwsh
        working-directory: Vulkan-Tools
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Collect and verify ARM64 binaries
        shell: pwsh
        working-directory: Vulkan-Tools
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $found = @()
          foreach ($name in @('vkcube.exe', 'vkcubepp.exe', 'vulkaninfo.exe')) {
            $hit = Get-ChildItem -Path build -Recurse -Filter $name -ErrorAction SilentlyContinue |
                   Sort-Object Length -Descending | Select-Object -First 1
            if ($null -ne $hit) {
              Copy-Item $hit.FullName out/
              $found += $hit.Name
            }
          }
          if ($found -notcontains 'vkcube.exe') { throw "vkcube.exe was not produced" }

          # Every collected binary must be an ARM64 PE, or it is useless here.
          foreach ($f in Get-ChildItem out -Filter *.exe) {
            $fs = [IO.File]::OpenRead($f.FullName)
            try {
              $br = [IO.BinaryReader]::new($fs)
              if ($br.ReadUInt16() -ne 0x5a4d) { throw "$($f.Name): no MZ header" }
              $fs.Position = 0x3c
              $peOff = $br.ReadUInt32()
              $fs.Position = $peOff
              if ($br.ReadUInt32() -ne 0x00004550) { throw "$($f.Name): no PE signature" }
              $machine = $br.ReadUInt16()
              if ($machine -ne 0xaa64) { throw "$($f.Name): machine 0x{0:X} is not ARM64" -f $machine }
            } finally { $fs.Dispose() }
            "{0}  {1} bytes  ARM64" -f $f.Name, $f.Length
            (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $f.Name
          }

      - name: Remove linked binaries from reusable build cache
        shell: pwsh
        run: |
          $dir = 'Vulkan-Tools/build'
          $binaries = @(Get-ChildItem -LiteralPath $dir -Recurse -File -Include '*.exe', '*.dll', '*.pdb' -ErrorAction SilentlyContinue)
          $binaries | Remove-Item -Force
          Write-Host "Removed $($binaries.Count) final Vulkan-Tools binaries from $dir before cache save"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-tools-arm64
          path: Vulkan-Tools/out/
          if-no-files-found: error
