name: VIOGPU performance regression

on:
  workflow_dispatch:
  push:
    branches: [perf/droidvm-gpu-20260914]
    paths:
      - 'external/mesa'
      - '.gitmodules'
      - 'viogpu/**'
      - '.github/workflows/viogpu-perf-regression.yml'
      - '.github/scripts/viogpu-perf-*'
  pull_request:
    paths:
      - 'external/mesa'
      - '.gitmodules'
      - 'viogpu/**'
      - '.github/workflows/viogpu-perf-regression.yml'

permissions:
  contents: read

concurrency:
  group: viogpu-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source revision for offline review
        run: |
          git rev-parse HEAD > viogpu-perf-revision.txt
          git archive --format=zip --output=viogpu-perf-source.zip HEAD
      - name: Upload reproducible source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-perf-source-${{ github.sha }}
          path: |
            viogpu-perf-source.zip
            viogpu-perf-revision.txt
          retention-days: 7
          if-no-files-found: error
      - name: Validate cumulative measurement parsing and A/B arithmetic
        run: python3 -m unittest discover -s viogpu/perf -p 'test_*.py' -v
      - name: Check Native Context contract
        run: python3 viogpu/viogpuwddm/check-contract.py
      - name: Run extracted production functions under ASan and UBSan
        run: python3 viogpu/tests/submit-perf/run.py
      - name: Prove the fixtures reject lifetime and ownership regressions
        run: |
          python3 viogpu/tests/submit-perf/run.py --negative-control-serial
          python3 viogpu/tests/submit-perf/run.py --negative-control-worker-reference
          python3 viogpu/tests/submit-perf/run.py --negative-control-pool-reset
      - name: Check flat package provenance and migration idempotence
        run: python3 -m unittest discover -s viogpu/package -p 'test_*.py'
      - name: Check existing final-binding and recovery behavior
        run: |
          python3 viogpu/tests/render-prepatch/run.py
          python3 viogpu/tests/fault-recovery/run.py
          python3 viogpu/tests/power-recovery/run.py

  msvc-production-fixtures:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select host MSVC tools (not the driver target)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate measurement CLI on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s viogpu/perf -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile and execute extracted production functions with MSVC
        shell: pwsh
        run: |
          python viogpu/tests/submit-perf/run.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  mesa-lifetime-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Verify exact Mesa gitlink and package identity
        run: |
          expected=$(git rev-parse HEAD:external/mesa)
          actual=$(git -C external/mesa rev-parse HEAD)
          test "$actual" = "$expected"
          printf 'driver=%s\nmesa=%s\n' "$(git rev-parse HEAD)" "$actual" > mesa-lifetime-pair.txt
          python3 -m unittest discover -s viogpu/package -p 'test_*.py'
      - name: Check pinned Mesa policy and extracted production functions
        run: |
          python3 external/mesa/src/freedreno/vulkan/tests/check_tu_wddm_policy.py
          python3 external/mesa/src/freedreno/vulkan/tests/lifetime-perf/run.py
          for reason in fence busy residency scratch; do
            python3 external/mesa/src/freedreno/vulkan/tests/lifetime-perf/run.py --negative-control "$reason"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-lifetime-pair-${{ github.sha }}
          path: mesa-lifetime-pair.txt
          retention-days: 7
          if-no-files-found: error
