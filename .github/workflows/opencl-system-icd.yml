name: Build flat OpenCL driver runtime
on:
  push:
    branches: [work/opencl-flat58474-20260912]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/OpenCL-ICD-Loader
          ref: f27c925e782499eebc4df20e121144358ccd5ac6
          path: opencl-loader
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/OpenCL-Headers
          ref: 386ca390b2f52efeb3e1a55a500690eb8013f60e
          path: opencl-headers
      - name: Build native, x64, x86 and ARM64X Khronos loaders
        shell: pwsh
        run: |
          $scripts = @('viogpu/opencl/build-loader.ps1','viogpu/opencl/build-proxy.ps1','viogpu/opencl/test-flat.ps1')
          foreach ($script in $scripts) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "PowerShell parse failure: $script $errors" }
          }
          ./viogpu/opencl/build-loader.ps1
          ./viogpu/opencl/build-proxy.ps1
      - name: Fetch exact runtime build and assemble verified payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 34698135078 -R sunflower2333/clvk --exit-status --interval 30
          if ($LASTEXITCODE) { throw 'OpenCL runtime CI failed' }
          $source = gh run view 34698135078 -R sunflower2333/clvk --json headSha --jq .headSha
          if ($LASTEXITCODE -or $source.Trim() -ne '0fc8338fe0f4998cb698f7b015c158c3cb232767') { throw 'OpenCL source mismatch' }
          gh run download 34698135078 -R sunflower2333/clvk --dir opencl-runtime
          if ($LASTEXITCODE) { throw 'OpenCL download failed' }
          python viogpu/opencl/package-flat.py --runtime opencl-runtime --loaders opencl-loaders --proxy opencl-proxy --output opencl-payload
          if ($LASTEXITCODE) { throw 'OpenCL package validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: viogpu-opencl-flat-unsigned
          path: opencl-payload/
          if-no-files-found: error
  loader-abi:
    runs-on: windows-11-arm
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viogpu-opencl-flat-unsigned
          path: opencl-payload
      - name: Execute native and emulated standard-loader dispatch
        shell: pwsh
        run: |
          ./viogpu/opencl/test-flat.ps1
