name: Build viogpu Native Context full WDDM ARM64

# The only driver target is ARM64.  x64 is used solely by runner-side host
# tools (MSBuild and the ABI fixture executables), never as a driver target.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "viogpu/common/**"
      - "viogpu/shared/viogpu_wddm_abi.h"
      - "viogpu/tests/native-context-wire/**"
      - "viogpu/tests/wddm-private-abi/**"
      - "viogpu/viogpudo/**"
      - "viogpu/viogpud3d/**"
      - "viogpu/viogpuwddm/**"
      - "VirtIO/**"
      - "NetKVM/Common/**"
      - "NetKVM/wlh/**"
      - "NetKVM/NetKVM-VS2015.vcxproj"
      - "viostor/**"
      - "vioscsi/**"
      - ".github/workflows/viogpuwddm-arm64-ci.yml"
  push:
    branches: [ master, viogpu-wddm3.1 ]
    paths:
      - "viogpu/common/**"
      - "viogpu/shared/viogpu_wddm_abi.h"
      - "viogpu/tests/native-context-wire/**"
      - "viogpu/tests/wddm-private-abi/**"
      - "viogpu/viogpudo/**"
      - "viogpu/viogpud3d/**"
      - "viogpu/viogpuwddm/**"
      - "VirtIO/**"
      - "NetKVM/Common/**"
      - "NetKVM/wlh/**"
      - "NetKVM/NetKVM-VS2015.vcxproj"
      - "viostor/**"
      - "vioscsi/**"
      - ".github/workflows/viogpuwddm-arm64-ci.yml"

jobs:
  contract-check:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate preinstalled Windows SDK and WDK
        shell: pwsh
        run: ./.github/scripts/locate-windows-kit.ps1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: arm64

      - name: Verify ARM64 cross-build host tools
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild -ErrorAction Stop).Source
          Write-Host "MSBuild host: $msbuild"
          if ($msbuild -notmatch '\\arm64\\MSBuild\.exe$') {
            throw "Expected the ARM64 MSBuild host required by the ARM64 WDK, got: $msbuild"
          }

      - name: Add host MSVC tools to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # ABI manifests below are host-only executables.  Driver projects
          # select Platform=ARM64 explicitly in the MSBuild invocations.
          arch: x64

      - name: Generate NetKVM MOF header
        shell: pwsh
        run: |
          Push-Location NetKVM/Mof
          cmd /c build.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Check native-context wire ABI manifest
        shell: cmd
        run: viogpu\tests\native-context-wire\run-msvc.cmd

      - name: Check DroidVM WDDM private ABI endpoints
        shell: cmd
        run: viogpu\tests\wddm-private-abi\run-msvc.cmd

      - name: Check Native Context full-miniport contract
        shell: pwsh
        run: python viogpu/viogpuwddm/check-contract.py

      - name: Parse Native Context diagnostic readers
        shell: pwsh
        run: |
          $scripts = @(
            '.install_scripts/viogpu-native-start-diagnostics.ps1',
            '.install_scripts/viogpu-native-present-diagnostics.ps1',
            '.install_scripts/install-viogpu-58085.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              throw "PowerShell parse failure in '$script': $($errors | Out-String)"
            }
          }

      - name: Exercise Native Present diagnostic decoder
        shell: pwsh
        run: .install_scripts/test-viogpu-native-present-diagnostics.ps1

      - name: Build shared dependencies and guest drivers
        shell: pwsh
        run: |
          $common = @(
            '/m',
            '/p:ApiValidator_Enable=false',
            '/p:SpectreMitigation=false',
            '/p:SignMode=Off',
            "/p:WindowsTargetPlatformVersion=$env:DROIDVM_KIT_VERSION"
          )
          $projects = @(
            @{ Path = 'VirtIO/VirtioLib.vcxproj'; Configuration = 'Win11 Release'; Platform = 'ARM64' },
            @{ Path = 'VirtIO/WDF/VirtioLib-WDF.vcxproj'; Configuration = 'Win11 Release'; Platform = 'ARM64' },
            @{ Path = 'NetKVM/CoInstaller/netkvmco-vs2015.vcxproj'; Configuration = 'Win11 Release'; Platform = 'ARM64' },
            @{ Path = 'NetKVM/ProtocolService/ProtocolService.vcxproj'; Configuration = 'Win11 Release'; Platform = 'ARM64' },
            @{ Path = 'viostor/viostor.vcxproj'; Configuration = 'Win11 Release'; Platform = 'ARM64' },
            @{ Path = 'vioscsi/vioscsi.vcxproj'; Configuration = 'Win11 Release'; Platform = 'ARM64' },
            @{ Path = 'NetKVM/NetKVM-VS2015.vcxproj'; Configuration = 'Win11 Release'; Platform = 'ARM64' },
            @{ Path = 'viogpu/viogpud3d/viogpud3d.vcxproj'; Configuration = 'Win11 Release'; Platform = 'ARM64' }
          )
          foreach ($project in $projects) {
            Write-Host "::group::build $($project.Path) [$($project.Configuration)|$($project.Platform)]"
            msbuild $project.Path `
              /p:Configuration="$($project.Configuration)" `
              /p:Platform="$($project.Platform)" @common
            $exitCode = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($exitCode -ne 0) { exit $exitCode }
          }

      - name: Build Native Context full-miniport target
        shell: pwsh
        run: |
          msbuild viogpu/viogpuwddm/viogpuwddm.vcxproj /m `
            /p:Configuration="Win11 Release" /p:Platform=ARM64 `
            /p:WindowsTargetPlatformVersion="$env:DROIDVM_KIT_VERSION" `
            /p:ApiValidator_Enable=false `
            /p:SpectreMitigation=false /p:SignMode=Off
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile opt-in WDDM test implementations
        shell: pwsh
        run: |
          # This is a compile/link experiment for the guarded UMD device/resource
          # lifecycle and capability query, RenderKm, and ResetEngine paths.  Keep
          # every intermediate/output tree separate so it cannot overwrite the
          # normal package inspected below.
          $testUmdOutDir = [IO.Path]::GetFullPath('viogpu/viogpuwddm/objtest_umd_win11_arm64/arm64/')
          $testOutDir = [IO.Path]::GetFullPath('viogpu/viogpuwddm/objtest_win11_arm64/arm64/')
          New-Item -ItemType Directory -Path $testUmdOutDir -Force | Out-Null
          New-Item -ItemType Directory -Path $testOutDir -Force | Out-Null
          msbuild viogpu/viogpud3d/viogpud3d.vcxproj /m `
            /p:Configuration="Win11 Release" /p:Platform=ARM64 `
            /p:WindowsTargetPlatformVersion="$env:DROIDVM_KIT_VERSION" `
            /p:ApiValidator_Enable=false `
            /p:SpectreMitigation=false /p:SignMode=Off `
            /p:VIOGPU_WDDM_TEST_IMPLEMENTATIONS=1 `
            /p:OutDir="$testUmdOutDir" /p:IntDir="$testUmdOutDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testUmd = Join-Path $testUmdOutDir 'viogpud3d.dll'
          if (-not (Test-Path -LiteralPath $testUmd -PathType Leaf)) {
            throw "experimental UMD build did not produce $testUmd"
          }
          Copy-Item -LiteralPath $testUmd -Destination (Join-Path $testOutDir 'viogpud3d.dll') -Force
          msbuild viogpu/viogpuwddm/viogpuwddm.vcxproj /m `
            /p:Configuration="Win11 Release" /p:Platform=ARM64 `
            /p:WindowsTargetPlatformVersion="$env:DROIDVM_KIT_VERSION" `
            /p:ApiValidator_Enable=false `
            /p:SpectreMitigation=false /p:SignMode=Off `
            /p:VIOGPU_WDDM_TEST_IMPLEMENTATIONS=1 `
            /p:OutDir="$testOutDir" /p:IntDir="$testOutDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testDriver = Join-Path $testOutDir 'viogpuwddm.sys'
          if (-not (Test-Path -LiteralPath $testDriver -PathType Leaf)) {
            throw "experimental WDDM build did not produce $testDriver"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $testOutDir 'viogpud3d.dll') -PathType Leaf)) {
            throw "experimental WDDM output is missing the matching UMD: $testOutDir"
          }
          Write-Host "experimental UMD DLL: $testUmd"
          Write-Host "experimental WDDM SYS: $testDriver"

      - name: Check registered full-miniport linkage
        shell: pwsh
        run: |
          $map = "viogpu/viogpuwddm/objfre_win11_arm64/arm64/viogpuwddm.map"
          $driver = "viogpu/viogpuwddm/objfre_win11_arm64/arm64/viogpuwddm.sys"

          foreach ($path in @($map, $driver)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Error "missing full-miniport linkage evidence: $path"
              exit 1
            }
          }

          $mapLines = Get-Content -LiteralPath $map
          $helperLines = @($mapLines | Where-Object {
            $tokens = @($_ -split '\s+' | Where-Object { $_ })
            ($tokens -contains 'VioGpuWddmInitializeMiniport') -and
              ($tokens[-1] -like '*driver_entry.obj')
          })
          if ($helperLines.Count -ne 1) {
            $mapLines | Where-Object { $_ -match 'Miniport|DxgkInitialize' } | Select-Object -First 20 | ForEach-Object { Write-Host "MAP candidate: $_" }
            $mapLines | Where-Object { $_ -match 'driver_entry\.obj' } | Select-Object -First 40 | ForEach-Object { Write-Host "driver_entry provenance: $_" }
            Write-Error "linker map must retain exactly one registration helper from driver_entry.obj"
            exit 1
          }

          $initializeLines = @($mapLines | Where-Object {
            $tokens = @($_ -split '\s+' | Where-Object { $_ })
            ($tokens -contains 'DxgkInitialize') -and
              ($tokens[-1] -like '*displib:displib.obj')
          })
          if ($initializeLines.Count -ne 1) {
            $mapLines | Where-Object { $_ -match 'Miniport|DxgkInitialize' } | Select-Object -First 20 | ForEach-Object { Write-Host "MAP candidate: $_" }
            Write-Error "linker map must resolve exactly one DxgkInitialize from displib:displib.obj"
            exit 1
          }

          $sectionRows = @(
            foreach ($line in $mapLines) {
              if ($line -match '^\s*(?<Section>[0-9A-Fa-f]{4}):[0-9A-Fa-f]{8}\s+[0-9A-Fa-f]+H\s+(?<Name>\S+)\s+CODE\s*$') {
                [pscustomobject]@{
                  Section = $Matches.Section.ToUpperInvariant()
                  Name = $Matches.Name
                }
              }
            }
          )
          $textSectionIds = @(
            $sectionRows |
              Where-Object { $_.Name.StartsWith('.text', [System.StringComparison]::Ordinal) } |
              Select-Object -ExpandProperty Section -Unique
          )
          if ($textSectionIds.Count -eq 0) {
            throw 'linker map contains no default .text CODE section'
          }

          $requiredTextSymbols = @(
            @{ Name = 'VioGpuDod::QueryNativeContextReadiness'; Pattern = '?QueryNativeContextReadiness@VioGpuDod@@' },
            @{ Name = 'VioGpuAdapter::QueryNativeContextReadiness'; Pattern = '?QueryNativeContextReadiness@VioGpuAdapter@@' }
          )
          foreach ($symbol in $requiredTextSymbols) {
            $symbolLines = @($mapLines | Where-Object { $_.Contains($symbol.Pattern) })
            if ($symbolLines.Count -ne 1) {
              $mapLines | Where-Object { $_ -match 'QueryNativeContextReadiness' } | ForEach-Object { Write-Host "MAP candidate: $_" }
              throw "linker map must contain exactly one $($symbol.Name) symbol"
            }
            $tokens = @($symbolLines[0] -split '\s+' | Where-Object { $_ })
            if ($tokens.Count -lt 2 -or $tokens[0] -notmatch '^(?<Section>[0-9A-Fa-f]{4}):') {
              throw "cannot parse linker-map section for $($symbol.Name): $($symbolLines[0])"
            }
            $sectionId = $Matches.Section.ToUpperInvariant()
            if ($textSectionIds -notcontains $sectionId -or $tokens[-1] -notlike '*viogpudo.obj') {
              throw "$($symbol.Name) must resolve from viogpudo.obj into default .text, got: $($symbolLines[0])"
            }
            Write-Host "nonpaged readiness: $($symbolLines[0])"
          }

          $initializeLines
          $helperLines

      - name: Validate ARM64 full-miniport INF and PE
        shell: pwsh
        run: |
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $infverif = $env:INFVERIF_PATH
          $root = 'viogpu/viogpuwddm/objfre_win11_arm64/arm64'
          $inf = Join-Path $root 'viogpuwddm.inf'
          $driver = Join-Path $root 'viogpuwddm.sys'
          $umd = Join-Path $root 'viogpud3d.dll'
          foreach ($path in @($infverif, $inf, $driver, $umd)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "missing full-miniport package evidence: $path"
            }
          }

          & $infverif /w /v $inf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function Assert-Arm64Pe([string] $path) {
            $stream = [IO.File]::OpenRead((Resolve-Path $path))
            try {
              $reader = [IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5a4d) { throw "$path does not have an MZ header" }
              $stream.Position = 0x3c
              $peOffset = $reader.ReadUInt32()
              if ($peOffset -gt $stream.Length - 6) { throw "$path has an invalid PE header offset" }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "$path does not have a PE signature" }
              if ($reader.ReadUInt16() -ne 0xaa64) { throw "$path PE machine is not ARM64 (AA64)" }
            }
            finally {
              $stream.Dispose()
            }
          }
          Assert-Arm64Pe $driver
          Assert-Arm64Pe $umd

          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          $exports = (& $dumpbin /nologo /exports $umd 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $umd" }
          $exportNames = @(
            foreach ($line in ($exports -split "`r?`n")) {
              if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') {
                $Matches[1]
              }
            }
          )
          $expectedExports = @('OpenAdapter', 'OpenAdapter10', 'OpenAdapter10_2')
          $exportDelta = Compare-Object -ReferenceObject $expectedExports -DifferenceObject $exportNames
          if ($exportDelta -or $exportNames.Count -ne $expectedExports.Count) {
            Write-Host $exports
            throw "UMD export table mismatch: $($exportNames -join ', ')"
          }
          if ($exportNames -contains 'OpenAdapter12') { throw 'legacy UMD shim must not export OpenAdapter12' }

      - name: Upload unsigned full-miniport artifact
        uses: actions/upload-artifact@v4
        with:
          name: viogpuwddm-arm64-unsigned
          path: |
            viogpu/viogpuwddm/objfre_win11_arm64/arm64/viogpuwddm.sys
            viogpu/viogpuwddm/objfre_win11_arm64/arm64/viogpuwddm.pdb
            viogpu/viogpuwddm/objfre_win11_arm64/arm64/viogpuwddm.map
            viogpu/viogpuwddm/objfre_win11_arm64/arm64/viogpuwddm.inf
            viogpu/viogpuwddm/objfre_win11_arm64/arm64/viogpud3d.dll
            viogpu/viogpuwddm/objfre_win11_arm64/arm64/viogpud3d.pdb
            viogpu/viogpuwddm/README.md
          if-no-files-found: error
