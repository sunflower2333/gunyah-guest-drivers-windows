name: vioinput reference audit
on:
  workflow_dispatch:
  push:
    branches: ['work/vioinput-*']
    paths: ['.github/workflows/vioinput-reference-audit.yml']
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch public Microsoft hardware documentation
        run: |
          curl -fL --retry 2 --max-time 90 https://aka.ms/gipdocs -o /tmp/gipdocs.zip
          mkdir -p references
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          archive = Path('/tmp/gipdocs.zip')
          metadata = {'source': 'https://aka.ms/gipdocs', 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}
          with zipfile.ZipFile(archive) as z:
              metadata['files'] = z.namelist()
              for name in z.namelist():
                  if 'xinputhid' in name.lower() and name.endswith('.docx'):
                      import io
                      with zipfile.ZipFile(io.BytesIO(z.read(name))) as doc:
                          root = ET.fromstring(doc.read('word/document.xml'))
                          ns = {'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
                          text = '\n'.join(''.join(p.itertext()) for p in root.findall('.//w:p', ns))
                          Path('references/xinputhid-reference.txt').write_text(text)
          Path('references/provenance.json').write_text(json.dumps(metadata, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vioinput-reference-audit
          path: references/
          retention-days: 1
