name: Build DroidVM ARM64 drivers

# Every emitted driver target below is ARM64.  x64 appears only for runner-side
# MSBuild/signing tools used to cross-compile and package the ARM64 binaries.

# 可手動觸發，或被其他 workflow 重用（dev-release.yml 會 call 它）。
# push 觸發移到 dev-release.yml，避免一次 push 重複建置兩次。
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  CONFIG: "Win11 Release"
  PLATFORM: "ARM64"
  OSMASK: "Server10_ARM64"          # 與 build/Driver.PackOne.targets 一致（Win11/ARM64）
  CERT_SUBJECT: "CN=DroidVM Test"
  PFX_PW: "droidvm"

jobs:
  opencl-icd:
    uses: ./.github/workflows/opencl-system-icd.yml

  opengl-icd:
    uses: ./.github/workflows/opengl-system-icd.yml

  zink-wait-tests:
    name: Zink abandoned-batch recovery regression
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Execute production batch wait and reset-query paths
        shell: pwsh
        run: python external/mesa/src/gallium/drivers/zink/zink_batch_wait_test.py
      - name: Execute UMD query and flush device-loss regression
        shell: pwsh
        run: python external/mesa/src/gallium/frontends/d3d10umd/device_loss_test.py
      - name: Execute empty-submit queue ordering regression
        shell: pwsh
        run: python external/mesa/src/freedreno/vulkan/tests/tu_wddm_empty_submit_test.py
      - name: Execute large command-buffer submission regression
        shell: pwsh
        run: python external/mesa/src/freedreno/vulkan/tests/tu_queue_batch_test.py
      - name: Execute suballocator mapping failure regression
        shell: pwsh
        run: python external/mesa/src/freedreno/vulkan/tests/tu_suballoc_failure_test.py
      - name: Execute command stream pooling and range ownership regression
        shell: pwsh
        run: python external/mesa/src/freedreno/vulkan/tests/tu_cs_pool_test.py
      - name: Execute bounded render reference and compute conversion regressions
        shell: pwsh
        run: |
          python external/mesa/src/freedreno/vulkan/tests/tu_wddm_reference_test.py
          if ($LASTEXITCODE) { throw 'Render reference regression failed' }
          python external/mesa/src/freedreno/vulkan/tests/tu_compute_compile_failure_test.py
          if ($LASTEXITCODE) { throw 'Compute conversion regression failed' }
      - name: Execute production fault and power recovery paths
        shell: pwsh
        run: |
          python viogpu/tests/fault-recovery/run.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python viogpu/tests/power-recovery/run.py
      - name: Execute fragmented backing and control descriptor regression
        shell: pwsh
        run: python viogpu/tests/backing-entries/run.py
      - name: Execute guest scanout layout and backing bounds
        shell: pwsh
        run: python viogpu/tests/guest-scanout/run.py
      - name: Execute Render prepatch and final residency regression
        shell: pwsh
        run: python viogpu/tests/render-prepatch/run.py
      - name: Execute native adapter identity and reply compatibility regression
        shell: pwsh
        run: python viogpu/tests/adapter-identity/run.py

  mesa-umd:
    name: Mesa D3D10 UMD (ARM64, cross-compiled)
    needs: zink-wait-tests
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up MSVC and WDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Install the WDK matching the selected SDK
        shell: pwsh
        run: |
          # d3d10umddi.h and d3dkmddi.h ship in the WDK, not the SDK.  They must
          # come from the same kit as every other Windows header: DXGK_FEATURE_ID
          # is declared in d3dukmdt.h on 10.0.26100.0 and in d3dkmddi.h on
          # 10.0.22000.0, so a build spanning two kits redefines it.  The runner
          # image carries a WDK-only 22000 kit that has no windows.h, so the fix
          # is to install the WDK for the SDK msvc-dev-cmd already selected and
          # leave INCLUDE alone.
          $sdkVersion = ($env:WindowsSDKVersion -replace '\\+$', '')
          if ([string]::IsNullOrWhiteSpace($sdkVersion)) {
            throw 'msvc-dev-cmd did not report a Windows SDK version'
          }
          $roots = @(
            'C:\Program Files (x86)\Windows Kits\10\Include',
            'C:\Program Files\Windows Kits\10\Include'
          ) | Where-Object { Test-Path $_ }

          function Test-KitComplete($version) {
            foreach ($root in $roots) {
              $kit = Join-Path $root $version
              if ((Test-Path (Join-Path $kit 'um\d3d10umddi.h')) -and
                  (Test-Path (Join-Path $kit 'shared\d3dkmddi.h')) -and
                  (Test-Path (Join-Path $kit 'um\windows.h'))) {
                return $kit
              }
            }
            return $null
          }

          $kit = Test-KitComplete $sdkVersion
          if ($null -eq $kit) {
            Write-Host "SDK $sdkVersion has no WDK headers; installing the WDK."
            $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
            # fwlink 2272234 is the WDK for Windows 11, version 24H2 (10.0.26100).
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2272234' -OutFile $installer
            $proc = Start-Process -FilePath $installer -ArgumentList '/quiet', '/norestart', '/features', '+' -Wait -PassThru
            Write-Host "WDK installer exit code: $($proc.ExitCode)"
            $kit = Test-KitComplete $sdkVersion
          }
          if ($null -eq $kit) {
            throw "no complete Windows kit for $sdkVersion after installing the WDK"
          }
          Write-Host "kit providing SDK and WDK headers: $kit"

          foreach ($header in @('windows.h', 'd3dkmthk.h', 'd3dkmddi.h', 'd3d10umddi.h', 'd3dumddi.h')) {
            $found = Get-ChildItem -Path ($env:INCLUDE -split ';' | Where-Object { $_ -and (Test-Path $_) }) `
              -Filter $header -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $found) {
              throw "required SDK/WDK header not found on INCLUDE: $header"
            }
            if ($found.FullName -notmatch [regex]::Escape($sdkVersion)) {
              throw "$header resolves outside kit ${sdkVersion}: $($found.FullName)"
            }
            Write-Host "$header -> $($found.FullName)"
          }

      - name: Verify LLVM toolchain
        shell: pwsh
        run: |
          $clang = Get-Command clang-cl.exe -ErrorAction Stop
          $archiver = Get-Command llvm-lib.exe -ErrorAction Stop
          Write-Host "clang-cl -> $($clang.Path)"
          Write-Host "llvm-lib -> $($archiver.Path)"
          & $clang.Path --version

      - name: Set up Python build tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Meson generators
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade `
            "meson==1.9.1" mako packaging pyyaml

      - name: Install Windows flex and bison
        shell: pwsh
        run: |
          $flex = Get-Command win_flex.exe -ErrorAction SilentlyContinue
          $bison = Get-Command win_bison.exe -ErrorAction SilentlyContinue
          if ($null -eq $flex -or $null -eq $bison) {
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
            if ($null -ne $winget) {
              & $winget.Source install --silent --accept-source-agreements --accept-package-agreements `
                --source winget --exact --id WinFlexBison.win_flex_bison --version 2.5.24
              if ($LASTEXITCODE -ne 0) {
                throw "WinFlexBison installation failed with exit code $LASTEXITCODE"
              }
            } else {
              $choco = Get-Command choco.exe -ErrorAction Stop
              & $choco.Source install winflexbison3 --yes --no-progress
              if ($LASTEXITCODE -ne 0) {
                throw "Chocolatey WinFlexBison installation failed with exit code $LASTEXITCODE"
              }
            }
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = "$machinePath;$userPath;$env:Path"
            $flex = Get-Command win_flex.exe -ErrorAction SilentlyContinue
            $bison = Get-Command win_bison.exe -ErrorAction SilentlyContinue
          }
          if ($null -eq $flex -or $null -eq $bison) {
            throw "WinFlexBison binaries were not found after installation"
          }
          $flexItem = Get-Item -LiteralPath $flex.Path -Force
          $flexBin = Split-Path -Parent $flex.Path
          if ($flexItem.Target) {
            $flexBin = Split-Path -Parent ([string]$flexItem.Target)
          }
          $env:Path = "$flexBin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $flexBin
          Write-Host "win_flex -> $($flex.Path)"
          Write-Host "win_bison -> $($bison.Path)"

      - name: Configure D3D10 UMD on zink
        shell: pwsh
        working-directory: external/mesa
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "mesa-d3d10-zink-arm64"
          $installDir = Join-Path $env:RUNNER_TEMP "mesa-d3d10-zink-install-arm64"
          if (Test-Path $buildDir) { Remove-Item -Recurse -Force $buildDir }
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $mesonOptions = @(
            '--backend=ninja',
            '--buildtype=release',
            # meson does NOT imply NDEBUG from buildtype, so without this the
            # shipped UMD keeps every assert() and unreachable() live.  A failed
            # assert calls abort(), and abort() inside a D3D user-mode driver
            # takes down whatever loaded it - on this guest that is dwm.exe,
            # which then crash-loops (70 faults in the first 50 seconds of
            # uptime, __fastfail(FAST_FAIL_FATAL_APP_EXIT) from the CRT abort).
            # A user-mode driver must never abort its host process.
            '-Db_ndebug=true',
            # emit debug symbols even for the release build, so a crash in the
            # shipped UMD can be symbolicated instead of hand-attributed
            '-Ddebug=true',
            '-Dplatforms=windows',
            '-Dgallium-drivers=zink',
            '-Dvulkan-drivers=[]',
            '-Dgallium-d3d10umd=true',
            '-Dgallium-d3d10umd-backend=zink',
            '-Dgallium-d3d10-dll-name=viogpud3d_zink',
            '-Dopengl=false',
            '-Dgles1=disabled',
            '-Dgles2=disabled',
            '-Degl=disabled',
            '-Dglx=disabled',
            '-Dgbm=disabled',
            '-Dllvm=disabled',
            '-Dshader-cache=disabled',
            '-Dzlib=enabled',
            '-Dzstd=disabled',
            '-Db_vscrt=static_from_buildtype',
            '-Dtools=[]',
            '-Dbuild-tests=false',
            '-Dwerror=false',
            "-Dprefix=$installDir"
          )
          $env:CC = 'clang-cl'
          $env:CXX = 'clang-cl'
          $env:AR = 'llvm-lib'
          # Meson must not execute ARM64 sanity binaries on the x64 runner.
          $crossFile = Join-Path $env:RUNNER_TEMP 'mesa-d3d10-zink-arm64-cross.ini'
          $crossFileLines = @(
            '[binaries]'
            "c = ['clang-cl', '--target=aarch64-pc-windows-msvc']"
            "cpp = ['clang-cl', '--target=aarch64-pc-windows-msvc']"
            "ar = 'llvm-lib'"
            ''
            '[host_machine]'
            "system = 'windows'"
            "cpu_family = 'aarch64'"
            "cpu = 'arm64'"
            "endian = 'little'"
            ''
            '[properties]'
            'needs_exe_wrapper = true'
            ''
            '[built-in options]'
            # clang-cl needs /Zi to emit debug info and lld-link needs /DEBUG to
            # write the PDB; meson's debug=true supplies the former but not the
            # latter for this cross setup, so the link step produced no symbols
            # at all.  Setting them here keeps the command line free for the
            # normal options.
            "c_args = ['/Zi']"
            "cpp_args = ['/Zi']"
            "c_link_args = ['/DEBUG']"
            "cpp_link_args = ['/DEBUG']"
          )
          Set-Content -LiteralPath $crossFile -Value $crossFileLines -Encoding ascii
          $setupArgs = @('setup', $buildDir, '.', '--cross-file', $crossFile) + $mesonOptions
          & meson @setupArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and link the D3D10 UMD
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "mesa-d3d10-zink-arm64"
          meson compile -C $buildDir --ninja-args=-k0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $library = Get-ChildItem -Path $buildDir -Recurse -File -Filter "viogpud3d_zink.dll" |
            Select-Object -First 1
          if ($null -eq $library) {
            throw "the zink D3D10 target did not produce viogpud3d_zink.dll"
          }
          Write-Host "Linked target: $($library.FullName)"
          $headers = & dumpbin /headers $library.FullName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for the linked target" }
          if (-not ($headers -match "AA64 machine")) {
            throw "linked target machine type does not match ARM64"
          }
          $exports = & dumpbin /exports $library.FullName 2>&1
          foreach ($symbol in @('OpenAdapter10', 'OpenAdapter10_2')) {
            if (-not ($exports -match $symbol)) {
              throw "the D3D10 UMD must export $symbol"
            }
          }
          Write-Host 'ARM64 D3D10 UMD links and exports its adapter entry points.'

      - name: Stage the Mesa user-mode driver
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "mesa-d3d10-zink-arm64"
          $library = Get-ChildItem -Path $buildDir -Recurse -File -Filter "viogpud3d_zink.dll" |
            Select-Object -First 1
          if ($null -eq $library) { throw "no viogpud3d_zink.dll to stage" }
          New-Item -ItemType Directory -Force mesa-umd | Out-Null
          # The driver package names the user-mode driver viogpud3d.dll, so the
          # file goes in under that name and is catalogued as the real thing.
          Copy-Item $library.FullName (Join-Path 'mesa-umd' 'viogpud3d.dll') -Force
          $symbols = Get-ChildItem -Path $library.DirectoryName -File -Filter 'viogpud3d_zink*.pdb' |
            Select-Object -First 1
          if ($null -eq $symbols) { throw 'the Mesa UMD has no matching PDB to stage' }
          python .install_scripts/verify-pe-pdb.py $library.FullName $symbols.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Mesa UMD/PDB identity mismatch' }
          Copy-Item $symbols.FullName (Join-Path 'mesa-umd' 'viogpud3d.pdb') -Force
          Get-FileHash (Join-Path 'mesa-umd' 'viogpud3d.dll') -Algorithm SHA256 | Format-List

      - name: Upload the Mesa user-mode driver
        uses: actions/upload-artifact@v4
        with:
          name: mesa-viogpud3d-arm64
          path: mesa-umd/
          if-no-files-found: error

  build:
    runs-on: windows-11-arm
    needs: [mesa-umd, opengl-icd, opencl-icd]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整歷史：driver 版號第四段用 commit 數（shallow 會變成 1）

      - name: Download the Mesa user-mode driver
        uses: actions/download-artifact@v4
        with:
          name: mesa-viogpud3d-arm64
          path: mesa-umd

      - name: Download the ABI-validated OpenGL system ICD payload
        uses: actions/download-artifact@v4
        with:
          name: viogpu-opengl-system-unsigned
          path: opengl-payload

      - name: Download verified OpenCL distribution
        uses: actions/download-artifact@v4
        with:
          name: viogpu-opencl-system-unsigned
          path: opencl-payload

      - name: Locate preinstalled Windows SDK and WDK
        shell: pwsh
        run: ./.github/scripts/locate-windows-kit.ps1 -RequirePackagingTools

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: arm64

      - name: Verify ARM64 cross-build host tools
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild -ErrorAction Stop).Source
          Write-Host "MSBuild host: $msbuild"
          if ($msbuild -notmatch '\\arm64\\MSBuild\.exe$') {
            throw "Expected the ARM64 MSBuild host required by the ARM64 WDK, got: $msbuild"
          }

      - name: Add host MSVC and WDK tools to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # These are host-side tools; every MSBuild target below remains ARM64.
          arch: x64

      - name: Generate NetKVM MOF header
        shell: pwsh
        run: |
          Push-Location NetKVM/Mof
          cmd /c build.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $mofHeader = Join-Path $PWD 'NetKVM\Common\netkvmmof.h'
          if (-not (Test-Path -LiteralPath $mofHeader -PathType Leaf)) {
            throw "NetKVM MOF generation did not produce $mofHeader"
          }

      # 診斷：列出可用的 Driver 平台工具集 / WDK，方便 build 失敗時定位
      - name: Diagnose toolchain
        shell: pwsh
        run: |
          Write-Host "=== VS instances ==="
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json | Out-String | Write-Host
          Write-Host "=== Windows Kits bin ==="
          Get-ChildItem $env:DROIDVM_KIT_BIN -ErrorAction SilentlyContinue | Select Name
          Write-Host "=== Driver platform toolset present? ==="
          Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\MSBuild\Microsoft\VC\*\Platforms\ARM64\PlatformToolsets" -ErrorAction SilentlyContinue |
            Select-Object FullName

      - name: Install CPDK (Cryptographic Provider Dev Kit, for viorng's CNG provider)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hdr = 'C:\Program Files (x86)\Windows Kits\10\Cryptographic Provider Development Kit\Include\bcrypt_provider.h'
          # 主：choco 套件
          & choco install windows-cryptographic-provider-development-kit -y --no-progress
          $chocoExit = $LASTEXITCODE
          if (-not (Test-Path $hdr)) {
            # 備援：直接下載官方 cpdksetup.exe 靜默安裝
            Write-Host "CPDK package install returned $chocoExit; trying cpdksetup.exe"
            $url='https://download.microsoft.com/download/1/7/6/176909B0-50F2-4DF3-B29B-830A17EA7E38/CPDK_RELEASE_UPDATE/cpdksetup.exe'
            Invoke-WebRequest -Uri $url -OutFile cpdksetup.exe
            Start-Process -FilePath .\cpdksetup.exe -ArgumentList '/q','/norestart' -Wait
          }
          if (-not (Test-Path $hdr)) {
            throw "CPDK header is required for the ARM64 viorng build: $hdr"
          }
          Write-Host "CPDK OK: $hdr"

      - name: Build ARM64 drivers
        shell: pwsh
        run: |
          # 逐 vcxproj 建，先按相依順序建 deps（msbuild sln /t:proj 不可靠，會把名稱當 target）：
          #   Mof(產 netkvmmof.h) -> VirtioLib / VirtioLib-WDF -> CoInstaller -> 各驅動
          # Primary guest-blob builds follow the frozen vkd3d58450 candidate.
          # Preserve the current GL/OpenCL/Mesa pairing and reserve 58451 onward.
          $epoch = 'ae36d7b0abeec37cb838f6f981d1599298799459'
          $epochMinor = 58450
          & git merge-base --is-ancestor $epoch HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "driver version epoch $epoch is not an ancestor of HEAD"
          }
          $n = (& git rev-list --count "$epoch..HEAD" | Out-String).Trim()
          if (-not ($n -match '^[1-9][0-9]*$')) {
            throw "invalid driver version distance from $epoch to HEAD: '$n'"
          }
          $minor = $epochMinor + [int]$n
          if ($minor -gt 65535) { throw "driver minor $minor exceeds 65535; start a new version epoch" }
          Write-Host "Driver version = 100.6.101.$minor"
          "DROIDVM_DRIVER_MINOR=$minor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $common = @('/m','/p:ApiValidator_Enable=false','/p:SpectreMitigation=false','/p:SignMode=Off',
                      "/p:WindowsTargetPlatformVersion=$env:DROIDVM_KIT_VERSION",
                      "/p:_BUILD_MINOR_VERSION_=$minor")
          $jobs = @(
            @{ p='VirtIO/VirtioLib.vcxproj';                c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='VirtIO/WDF/VirtioLib-WDF.vcxproj';        c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='NetKVM/CoInstaller/netkvmco-vs2015.vcxproj'; c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='viosock/lib/viosocklib.vcxproj';          c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='viosock/wspsvc/viosockwspsvc.vcxproj';    c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='NetKVM/ProtocolService/ProtocolService.vcxproj'; c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='viorng/cng/um/viorngum.vcxproj';          c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='vioinput/hidpassthrough/hidpassthrough.vcxproj'; c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='vioinput/sys/vioinput.vcxproj';           c='Win11 Release'; plat='ARM64' },
            @{ p='viogpu/viogpuap/viogpuap.vcxproj';        c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='viogpu/viogpusc/viogpusc.vcxproj';        c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='viogpu/viogpures/viogpures.vcxproj';      c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='viogpu/viogpud3d/viogpud3d.vcxproj';      c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='viogpu/viogpuwddm/viogpuwddm.vcxproj';    c='Win11 Release'; plat='ARM64' },
            @{ p='viostor/viostor.vcxproj';                 c='Win11 Release'; plat='ARM64' },
            @{ p='vioscsi/vioscsi.vcxproj';                 c='Win11 Release'; plat='ARM64' },
            @{ p='vioserial/sys/vioser.vcxproj';            c='Win11 Release'; plat='ARM64' },
            @{ p='viorng/viorng/viorng.vcxproj';            c='Win11 Release'; plat='ARM64' },
            @{ p='viosock/sys/viosock.vcxproj';             c='Win11 Release'; plat='ARM64' },
            @{ p='NetKVM/NetKVM-VS2015.vcxproj';            c='Win11 Release'; plat='ARM64' },
            @{ p='pvmpower/pvmpower.vcxproj';               c='Release';       plat='ARM64' }
          )
          $failed = @()
          foreach ($j in $jobs) {
            Write-Host "::group::build $($j.p) [$($j.c)|$($j.plat)]"
            msbuild $j.p /p:Configuration="$($j.c)" /p:Platform="$($j.plat)" @common
            if ($LASTEXITCODE -ne 0) {
              $failed += $j.p
              if ($j.dep) { Write-Host "::error::dependency $($j.p) failed — 後續驅動可能連不到" }
            }
            Write-Host "::endgroup::"
          }
          if ($failed.Count) {
            throw "ARM64 driver build failed: $($failed -join ', ')"
          }

      - name: Validate Native Context product PE and UMD exports
        shell: pwsh
        run: |
          $root = 'viogpu/viogpuwddm/objfre_win11_arm64/arm64'
          $driver = Join-Path $root 'viogpuwddm.sys'
          $umd = Join-Path $root 'viogpud3d.dll'
          $inf = Join-Path $root 'viogpuwddm.inf'
          $map = Join-Path $root 'viogpuwddm.map'
          foreach ($path in @($driver, $umd, $inf, $map)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "missing Native Context product PE: $path"
            }
          }

          if ([int]$env:DROIDVM_DRIVER_MINOR -le 58450) {
            throw "Native Context product version must rank above installed 100.6.101.58180"
          }
          $infVersion = "100.6.101.$env:DROIDVM_DRIVER_MINOR"
          $infText = Get-Content -LiteralPath $inf -Raw
          if ($infText -notmatch "(?m)^DriverVer\s*=\s*[^,]+,\s*$([regex]::Escape($infVersion))\s*$") {
            throw "Native Context INF does not contain expected DriverVer $infVersion"
          }

          function Assert-Arm64Pe([string] $path) {
            $stream = [IO.File]::OpenRead((Resolve-Path $path))
            try {
              $reader = [IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5a4d) { throw "$path does not have an MZ header" }
              $stream.Position = 0x3c
              $peOffset = $reader.ReadUInt32()
              if ($peOffset -gt $stream.Length - 6) { throw "$path has an invalid PE header offset" }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "$path does not have a PE signature" }
              if ($reader.ReadUInt16() -ne 0xaa64) { throw "$path PE machine is not ARM64 (AA64)" }
            }
            finally {
              $stream.Dispose()
            }
          }
          Assert-Arm64Pe $driver
          Assert-Arm64Pe $umd

          $mapLines = Get-Content -LiteralPath $map
          $sectionRows = @(
            foreach ($line in $mapLines) {
              if ($line -match '^\s*(?<Section>[0-9A-Fa-f]{4}):[0-9A-Fa-f]{8}\s+[0-9A-Fa-f]+H\s+(?<Name>\S+)\s+CODE\s*$') {
                [pscustomobject]@{
                  Section = $Matches.Section.ToUpperInvariant()
                  Name = $Matches.Name
                }
              }
            }
          )
          $textSectionIds = @(
            $sectionRows |
              Where-Object { $_.Name.StartsWith('.text', [System.StringComparison]::Ordinal) } |
              Select-Object -ExpandProperty Section -Unique
          )
          if ($textSectionIds.Count -eq 0) {
            throw 'linker map contains no default .text CODE section'
          }

          $requiredTextSymbols = @(
            @{ Name = 'VioGpuDod::GetScanLine'; Pattern = '?GetScanLine@VioGpuDod@@'; Object = '*viogpudo.obj' },
            @{ Name = 'VioGpuDod::SetCrtcTiming'; Pattern = '?SetCrtcTiming@VioGpuDod@@'; Object = '*viogpudo.obj' },
            @{ Name = 'VioGpuDod::ArmCrtcVsyncTimer'; Pattern = '?ArmCrtcVsyncTimer@VioGpuDod@@'; Object = '*viogpudo.obj' },
            @{ Name = 'VioGpuDod::AcquireNativeSubmissionOperation'; Pattern = '?AcquireNativeSubmissionOperation@VioGpuDod@@'; Object = '*viogpudo.obj' },
            @{ Name = 'VioGpuDod::ReleaseNativeSubmissionOperation'; Pattern = '?ReleaseNativeSubmissionOperation@VioGpuDod@@'; Object = '*viogpudo.obj' },
            @{ Name = 'VioGpuAdapter::ReleaseNativeSubmitOperation'; Pattern = '?ReleaseNativeSubmitOperation@VioGpuAdapter@@'; Object = '*viogpudo.obj' },
            @{ Name = 'VioGpuDod::QueryNativeContextReadiness'; Pattern = '?QueryNativeContextReadiness@VioGpuDod@@'; Object = '*viogpudo.obj' },
            @{ Name = 'VioGpuAdapter::QueryNativeContextReadiness'; Pattern = '?QueryNativeContextReadiness@VioGpuAdapter@@'; Object = '*viogpudo.obj' },
            @{ Name = 'VioGpuBuf::AllocateMemory'; Pattern = '?AllocateMemory@VioGpuBuf@@'; Object = '*viogpu_queue.obj' },
            @{ Name = 'VioGpuBuf::FreeMemory'; Pattern = '?FreeMemory@VioGpuBuf@@'; Object = '*viogpu_queue.obj' }
          )
          foreach ($symbol in $requiredTextSymbols) {
            $symbolLines = @($mapLines | Where-Object {
              $row = @($_ -split '\s+' | Where-Object { $_ })
              # CFG records such as __guard_fids_?ArmCrtcVsyncTimer contain
              # the name too, but are metadata, not the executable symbol.
              $row.Count -ge 2 -and $row[1].StartsWith($symbol.Pattern, [StringComparison]::Ordinal)
            })
            if ($symbolLines.Count -ne 1) {
              $symbolLines | ForEach-Object { Write-Host "MAP candidate: $_" }
              throw "linker map must contain exactly one $($symbol.Name) symbol, found $($symbolLines.Count)"
            }
            $tokens = @($symbolLines[0] -split '\s+' | Where-Object { $_ })
            if ($tokens.Count -lt 2 -or $tokens[0] -notmatch '^(?<Section>[0-9A-Fa-f]{4}):') {
              throw "cannot parse linker-map section for $($symbol.Name): $($symbolLines[0])"
            }
            $sectionId = $Matches.Section.ToUpperInvariant()
            if ($textSectionIds -notcontains $sectionId -or $tokens[-1] -notlike $symbol.Object) {
              throw "$($symbol.Name) must resolve from $($symbol.Object) into default .text, got: $($symbolLines[0])"
            }
            Write-Host "nonpaged routine: $($symbolLines[0])"
          }

          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          $exports = (& $dumpbin /nologo /exports $umd 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $umd" }
          $exportNames = @(
            foreach ($line in ($exports -split "`r?`n")) {
              if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') {
                $Matches[1]
              }
            }
          )
          $expectedExports = @('OpenAdapter', 'OpenAdapter10', 'OpenAdapter10_2')
          $exportDelta = Compare-Object -ReferenceObject $expectedExports -DifferenceObject $exportNames
          if ($exportDelta -or $exportNames.Count -ne $expectedExports.Count) {
            Write-Host $exports
            throw "UMD export table mismatch: $($exportNames -join ', ')"
          }
          if ($exportNames -contains 'OpenAdapter12') { throw 'legacy UMD shim must not export OpenAdapter12' }

      - name: Sign + package
        shell: pwsh
        env:
          # 固定簽章憑證（建議）：把 .pfx 的 base64 放進此 secret，每次 run 都用同一張憑證
          # 簽，跨 build 一致。未設定時退回每次新生的自簽憑證（跨 run 憑證會不同）。
          PFX_B64: ${{ secrets.DROIDVM_PFX_BASE64 }}
          # pfx 密碼 secret（可選）；未設定就用 env:PFX_PW 預設值
          PFX_PW_SECRET: ${{ secrets.DROIDVM_PFX_PW }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = $env:SIGNTOOL_PATH
          $inf2cat  = $env:INF2CAT_PATH
          $stampinf = $env:STAMPINF_PATH
          $infverif = $env:INFVERIF_PATH
          $missingTools = @($signtool, $inf2cat, $stampinf, $infverif) |
            Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missingTools) {
            throw "Windows Kit $env:DROIDVM_KIT_VERSION packaging tools are incomplete: $($missingTools -join '; ')"
          }
          Write-Host "Packaging with Windows Kit $env:DROIDVM_KIT_VERSION"

          New-Item -ItemType Directory -Force out | Out-Null
          $pfx = "out\DroidVM_Test.pfx"
          $pfxPw = if ($env:PFX_PW_SECRET) { $env:PFX_PW_SECRET } else { $env:PFX_PW }
          $pw = ConvertTo-SecureString "$pfxPw" -AsPlainText -Force
          if ($env:PFX_B64) {
            # 固定憑證：從 secret 還原 pfx -> 每次 run 都同一張
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My `
                      -Password $pw -Exportable
            Export-Certificate -Cert $cert -FilePath "out\DroidVM_Test.cer" | Out-Null
            Write-Host "[sign] 固定憑證 (secret DROIDVM_PFX_BASE64): $($cert.Subject) $($cert.Thumbprint)"
          } else {
            Write-Host "::warning::未設定 DROIDVM_PFX_BASE64 -> 改用每次新生的自簽憑證（驅動跨 run 會是不同金鑰的同名憑證）。設定固定 pfx secret 可統一。"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "$env:CERT_SUBJECT" `
                      -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable `
                      -KeyUsage DigitalSignature -NotAfter (Get-Date).AddYears(10)
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
            Export-Certificate   -Cert $cert -FilePath "out\DroidVM_Test.cer" | Out-Null
          }

          # 按 inf 需求，從 build 樹組裝每個 driver package（root, 需要的二進位, 對應 inf）
          $drv = @(
            @{ n='viostor';   root='viostor';   bins=@('viostor.sys');  inf='viostor.inf' },
            @{ n='vioscsi';   root='vioscsi';   bins=@('vioscsi.sys');  inf='vioscsi.inf' },
            @{ n='vioserial'; root='vioserial'; bins=@('vioser.sys');   inf='vioser.inf' },
            @{ n='viorng';    root='viorng';    bins=@('viorng.sys','viorngum.dll'); inf='viorng.inf' },
            @{ n='viosock';   root='viosock';   bins=@('viosock.sys','viosocklib.dll','viosockwspsvc.exe'); inf='viosock.inf' },
            @{ n='NetKVM';    root='NetKVM';    bins=@('netkvm.sys','netkvmp.exe'); inf='netkvm.inf' },
            @{ n='vioinput';  root='vioinput';  bins=@('vioinput.sys','viohidkmdf.sys'); inf='vioinput.inf' },
            @{ n='viogpu'; root='viogpu/viogpuwddm'; bins=@('viogpuwddm.sys','viogpud3d.dll'); inf='viogpuwddm.inf' },
            @{ n='pvmpower';  root='pvmpower';  bins=@('pvmpower.sys'); inf='pvmpower.inf' }
          )
          $nativeDebugRoot = 'viogpu/viogpuwddm/objfre_win11_arm64/arm64'
          $nativeDebugFiles = @('viogpuwddm.pdb', 'viogpuwddm.map')
          # 在 root 下找最佳檔案：優先路徑含 ARM64、最新修改
          function Pick($root,$file) {
            Get-ChildItem $root -Recurse -Filter $file -File -EA SilentlyContinue |
              Where-Object { $_.FullName -match 'ARM64|arm64' } |
              Sort-Object LastWriteTime -Desc | Select-Object -First 1
          }
          # inf：優先 ARM64 已 stamp -> 任何 .inf -> source .inx（後面 stampinf 補 token）
          function PickInf($root,$file) {
            $f = Pick $root $file
            if ($f) { return $f }
            $f = Get-ChildItem $root -Recurse -Filter $file -File -EA SilentlyContinue |
              Sort-Object LastWriteTime -Desc | Select-Object -First 1
            if ($f) { return $f }
            $inx = [IO.Path]::ChangeExtension($file,'.inx')
            Get-ChildItem $root -Recurse -Filter $inx -File -EA SilentlyContinue |
              Sort-Object LastWriteTime -Desc | Select-Object -First 1
          }
          foreach ($d in $drv) {
            $dest = "out\drivers\$($d.n)"; New-Item -ItemType Directory -Force $dest | Out-Null
            $ok = $true
            foreach ($b in $d.bins) {
              $f = Pick $d.root $b
              if ($f -and $f.Length -gt 0) { Copy-Item $f.FullName $dest -Force } else { Write-Host "::warning::$($d.n): 缺少非空的 $b"; $ok=$false }
            }
            # viogpu ships Mesa's D3D10 UMD, built by the mesa-umd job from the
            # pinned submodule. It has to land before signing and inf2cat so the
            # catalogue covers the driver that actually runs: hand-copying it
            # into the DriverStore afterwards does not survive a reboot, and the
            # package's own stub came back every boot to a black desktop.
            if ($d.n -eq 'viogpu') {
              $mesaUmd = Join-Path $env:GITHUB_WORKSPACE 'mesa-umd/viogpud3d.dll'
              if (-not (Test-Path $mesaUmd)) { throw "viogpu: the Mesa user-mode driver is missing" }
              Copy-Item $mesaUmd (Join-Path $dest 'viogpud3d.dll') -Force
              $mesaHash = (Get-FileHash (Join-Path $dest 'viogpud3d.dll') -Algorithm SHA256).Hash
              Write-Host "viogpu: packaged Mesa UMD $mesaHash"
            }
            # 取 inf（優先 ARM64 已 stamp；否則 source 模板）
            $infF = PickInf $d.root $d.inf
            if ($infF -and $infF.Length -gt 0) { Copy-Item $infF.FullName (Join-Path $dest $d.inf) -Force } else { Write-Host "::warning::$($d.n): 缺少非空的 $($d.inf)"; $ok=$false }
            if (-not $ok) { throw "$($d.n) ARM64 package is incomplete" }
            $infPath = Join-Path $dest $d.inf
            # 把 .inx 模板的 INX_* token 換掉。上游是用 package project（vioinput/package、
            # VirtRNG Package）透過 build/Driver.*.props 的 <Substitution> 做；本 CI 只 build
            # sys vcxproj，所以在 build script 補上 Win11/RHEL 對應值，保持上游 vcxproj/inx 不動。
            # 已替換好的 inf（viostor 等）沒有 INX_ token，這裡會是 no-op。
            $inxMap = [ordered]@{
              '_INX_SUBSYS_VENDOR_ID'              = '1AF4'
              'INX_PLATFORM_DRIVERS_DIR'           = '13'
              'INX_BASE_ON_SYSTEM_ROOT_DRIVER_DIR' = '%13%'
              'INX_NETKVM_DMAREMAP'                = '2'
              'INX_NETKVM_SEPARATE_TAIL'           = '1'
              'INX_COMPANY'                        = 'Red Hat, Inc.'
              'INX_PREFIX_VENDOR'                  = 'Red Hat '
              'INX_PREFIX_VIRTIO'                  = ''
              'INX_PREFIX_QEMU'                    = ''
              'INX_COPYRIGHT_1'                    = 'Copyright (c) Red Hat Inc.'
              'INX_COPYRIGHT_2'                    = ''
            }
            $raw = Get-Content $infPath -Raw
            foreach ($k in $inxMap.Keys) { $raw = $raw.Replace($k, [string]$inxMap[$k]) }
            Set-Content -LiteralPath $infPath -Value $raw -NoNewline -Encoding utf8
            # 若 inf 仍有 stampinf token，補做 stampinf（$ARCH$ -> ARM64, $KMDFVERSION$ -> 1.15）
            if ((Get-Content $infPath -Raw) -match '\$ARCH\$|\$KMDFVERSION\$') {
              & $stampinf -f $infPath -a ARM64 -k 1.15 -d "*" -v "*"
              if ($LASTEXITCODE -ne 0) { throw "stampinf failed for $($d.n)" }
              Write-Host "stampinf -> $($d.n)"
            }
            # 防呆：替換後仍殘留 INX_* token（代表上面 $inxMap 漏了 token）-> 擋下不簽、build 失敗，
            # 避免再次靜默出貨壞掉的 inf（ServiceBinary 路徑會是壞的、驅動裝不起來）。
            if ((Get-Content $infPath -Raw) -match 'INX_[A-Z_]+') {
              throw "$($d.n): $($d.inf) still contains INX_* tokens after substitution"
            }
            if ((Get-Content $infPath -Raw) -match 'NT(?:ARM64|AMD64|x86)(?:\.\d+){2,}\.\.\.\d+\.\d+\.\d+') {
              throw "$($d.n): $($d.inf) contains a duplicated TargetOSVersion decoration"
            }
            if ($d.n -eq 'viogpu') {
              & $infverif /w /v $infPath
              if ($LASTEXITCODE -ne 0) { throw "InfVerif failed for $($d.n)" }
            }
            # 簽所有 PE
            $peFiles = Get-ChildItem -LiteralPath $dest -File |
              Where-Object { $_.Extension -in @('.sys', '.dll', '.exe') }
            foreach ($pe in $peFiles) {
              & $signtool sign /fd SHA256 /f $pfx /p "$pfxPw" $pe.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($pe.FullName)" }
            }
            # 產 cat + 簽
            & $inf2cat /driver:$dest /os:$env:OSMASK
            if ($LASTEXITCODE -ne 0) { throw "inf2cat failed for $($d.n)" }
            $catFiles = @(Get-ChildItem -LiteralPath $dest -Filter '*.cat' -File)
            if ($catFiles.Count -eq 0) { throw "inf2cat produced no catalog for $($d.n)" }
            $emptyCatalogs = @($catFiles | Where-Object { $_.Length -eq 0 })
            if ($emptyCatalogs.Count -ne 0) { throw "inf2cat produced an empty catalog for $($d.n)" }
            foreach ($cat in $catFiles) {
              & $signtool sign /fd SHA256 /f $pfx /p "$pfxPw" $cat.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($cat.FullName)" }
            }
            if ($d.n -eq 'viogpu') {
              foreach ($debugFile in $nativeDebugFiles) {
                $debugSource = Join-Path $nativeDebugRoot $debugFile
                if (-not (Test-Path -LiteralPath $debugSource -PathType Leaf) -or
                    (Get-Item -LiteralPath $debugSource).Length -eq 0) {
                  throw "Native Context product debug file is missing or empty: $debugSource"
                }
                Copy-Item -LiteralPath $debugSource -Destination $dest -Force
              }
              # The installed UMD is Mesa, so its symbols must come from that
              # same link rather than the separately built D3D shim.
              $mesaPdb = Join-Path $env:GITHUB_WORKSPACE 'mesa-umd/viogpud3d.pdb'
              Copy-Item -LiteralPath $mesaPdb -Destination $dest -Force
              python .install_scripts/verify-pe-pdb.py (Join-Path $dest 'viogpud3d.dll') (Join-Path $dest 'viogpud3d.pdb')
              if ($LASTEXITCODE -ne 0) { throw 'Packaged Mesa UMD/PDB identity mismatch' }
            }
            $has = (Get-ChildItem "$dest" | ForEach-Object Name) -join ' '
            Write-Host "packed $($d.n): $has"
          }
          # The system ICD is an explicit, cataloged sidecar. Preserve its
          # architecture directories and bind it to these exact signed KMD/UMD
          # files; never flatten dependencies into the DriverStore or overwrite
          # Microsoft's opengl32.dll.
          ./.github/scripts/sign-opengl-sidecar.ps1 -Payload opengl-payload `
            -Output out/opengl -Kmd out/drivers/viogpu/viogpuwddm.sys `
            -Umd out/drivers/viogpu/viogpud3d.dll -Pfx $pfx `
            -PfxPassword $pfxPw -SignTool $signtool
          ./.github/scripts/sign-opencl-sidecar.ps1 -Payload opencl-payload `
            -Output out/opencl -Kmd out/drivers/viogpu/viogpuwddm.sys `
            -Umd out/drivers/viogpu/viogpud3d.dll -Pfx $pfx `
            -PfxPassword $pfxPw -SignTool $signtool
          $signedClRoot = (Resolve-Path 'out/opencl/payload').Path
          foreach ($arch in @('arm64','x64','x86')) {
            $loaderArch = if ($arch -eq 'x86') {'x86'} else {'arm64x'}
            & (Join-Path $signedClRoot "loaders/$arch/loader-check.exe") (Join-Path $signedClRoot "loaders/$loaderArch/OpenCL.dll")
            if ($LASTEXITCODE) { throw "Signed OpenCL $arch loader ABI validation failed" }
          }
          foreach ($scriptName in @('install-opencl-icd.ps1','opencl-registration.psm1','test-opencl-installed.ps1')) {
            Copy-Item (Join-Path '.install_scripts' $scriptName) out
            $signedScript = Set-AuthenticodeSignature -FilePath (Join-Path 'out' $scriptName) -Certificate $cert -HashAlgorithm SHA256
            if (!$signedScript.SignerCertificate -or $signedScript.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw "OpenCL script signing failed: $scriptName" }
          }
          $signedOpenGlRoot = (Resolve-Path 'out/opengl/payload').Path
          foreach ($arch in @('arm64','x64','x86')) {
            & (Join-Path $signedOpenGlRoot "system-probe-$arch.exe") --load-only $signedOpenGlRoot
            if ($LASTEXITCODE) { throw "Signed OpenGL $arch ABI validation failed" }
            & (Join-Path $signedOpenGlRoot "gles-probe-$arch.exe") --load-only $signedOpenGlRoot
            if ($LASTEXITCODE) { throw "Signed GLES $arch ABI validation failed" }
          }
          foreach ($scriptName in @('install-opengl-icd.ps1','opengl-registration.psm1')) {
            Copy-Item -LiteralPath (Join-Path '.install_scripts' $scriptName) -Destination out
            $signedScript = Set-AuthenticodeSignature -FilePath (Join-Path 'out' $scriptName) -Certificate $cert -HashAlgorithm SHA256
            if (!$signedScript.SignerCertificate -or $signedScript.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "OpenGL installer signing failed: $scriptName"
            }
          }
          # --- bundle installer into the artifact (source: .install_scripts/) ---
          # INSTALL.cmd (UAC launcher) + install-drivers.ps1 install the pVM drivers
          # (viogpu/pvmpower/storage/input, then NetKVM last) and remove
          # older versions.
          Copy-Item .install_scripts\INSTALL.cmd, .install_scripts\install-drivers.ps1, .install_scripts\pvmpower-devnode.ps1 out\ -Force
          Write-Host "[pkg] bundled out\INSTALL.cmd + installer scripts"

          Remove-Item $pfx -Force   # 不上傳私鑰
          Write-Host "=== staged ==="; Get-ChildItem -Recurse out -File | Select FullName
          $packageDirs = Get-ChildItem out\drivers -Directory
          if ($packageDirs.Count -ne $drv.Count) {
            throw "Expected $($drv.Count) complete ARM64 driver packages, found $($packageDirs.Count)"
          }
          $stagedFiles = @(Get-ChildItem -LiteralPath out -Recurse -File)
          if ($stagedFiles.Count -eq 0) { throw 'ARM64 bundle staging is empty' }
          $emptyFiles = @($stagedFiles | Where-Object { $_.Length -eq 0 })
          if ($emptyFiles.Count -ne 0) {
            throw "ARM64 bundle contains empty files: $($emptyFiles.FullName -join '; ')"
          }

      - name: Upload drivers artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-arm64-drivers
          path: out/**
          if-no-files-found: error
