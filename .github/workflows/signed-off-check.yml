name: Signoff and Red Hat Jira check
# Manual only. This gate asks every commit for a Signed-off-by line and a Red
# Hat Jira reference. That is upstream virtio-win's contribution process; this
# fork does not file against that Jira, so the check can only ever fail here.
#
# Kept rather than deleted so it still runs on demand (Actions -> Run workflow)
# and so a future merge from upstream sees a file, not a hole.
on: workflow_dispatch

jobs:
  check-signoff:
    name: Signed-off-by and Red Hat Jira ref
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Signed-off-by and Jira ref (when Red Hat signs off)
        run: |
          bash Tools/check-signed-off.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
