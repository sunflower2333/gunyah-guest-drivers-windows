name: Prepare independent video branch CI
# One-shot maintenance of this exact candidate. It creates reviewable Git
# objects only; the connected reviewer performs the final non-force ref update.
on:
  push:
    branches: [work/vpu-video-umd-perf-20260915]
    paths: ['.github/workflows/viogpu-video-branch-ci-once.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'sunflower2333/gunyah-guest-drivers-windows' && github.ref == 'refs/heads/work/vpu-video-umd-perf-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply hash-guarded export and branch trigger migration
        run: |
          python3 .github/scripts/prepare-video-branch-ci.py
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('viogpu/viogpuwddm/check-contract.py')
          source = p.read_text()
          old = 'def canonical_code(source: str) -> str:\n    code = compact_code(source)\n'
          new = """def canonical_code(source: str) -> str:
              # Fold only adjacent, escape-free wide identifier literals emitted by the formatter.
              # Spelling, encoding, operators and counter indices remain part of the contract.
              pattern = r'\\bL"([A-Za-z0-9_]*)"\\s+L"([A-Za-z0-9_]*)"'
              while True:
                  source, replacements = re.subn(pattern, r'L"\\1\\2"', source)
                  if replacements == 0:
                      break
              code = compact_code(source)
          """
          assert source.count(old) == 1, 'Canonical helper changed'
          p.write_text(source.replace(old, new))
          p = Path('.github/workflows/viogpu-video-ci.yml')
          source = p.read_text()
          target = '  arm64-build:\n'
          added = ('      - name: Check diagnostic string normalization without weakening names\n'
                   '        run: python3 viogpu/tests/video/canonical_string_contract_test.py\n')
          assert source.count(target) == 1
          p.write_text(source.replace(target, added + target))
          root=Path.cwd()
          p=root/'viogpu/viogpuwddm/check-contract.py'
          s=p.read_text();old='if(!target.StandardPrimary)returnVioGpuFlipTargetNotPrimary;if(target.HighPrecision)returnVioGpuFlipTargetHighPrecision;'
          new='if(!target.StandardPrimary){returnVioGpuFlipTargetNotPrimary;}if(target.HighPrecision){returnVioGpuFlipTargetHighPrecision;}'
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=root/'viogpu/tests/advanced-color-contract/run.py';s=p.read_text()
          old='''def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit(f"mutation anchor not unique ({text.count(old)}): {old[:70]!r}")
              return text.replace(old, new)
          '''
          new='''def anchor_matches(text, anchor):
              """Match the same non-whitespace source characters across formatter wrapping."""
              pattern = r"\\s*".join(re.escape(ch) for ch in anchor if not ch.isspace())
              if not pattern:
                  raise ValueError("empty mutation anchor")
              return list(re.finditer(pattern, text))


          def replace_once(text, old, new):
              """Replace one unique production anchor; a changed name/operator still fails."""
              matches = anchor_matches(text, old)
              if len(matches) != 1:
                  raise SystemExit(f"mutation anchor not unique ({len(matches)}): {old[:70]!r}")
              match = matches[0]
              return text[:match.start()] + new + text[match.end():]
          '''
          assert s.count(old)==1;s=s.replace(old,new)
          s=s.replace('    at = text.index(marker)','    matches = anchor_matches(text, marker)\n    if len(matches) != 1:\n        raise SystemExit(f"gate marker not unique: {marker!r}")\n    at = matches[0].start()')
          s=s.replace('    if (m_pHWDevice != NULL && !IsRenderOnly()) m_pHWDevice->RequestColorConnectionRefresh();','m_pHWDevice->RequestColorConnectionRefresh();')
          s=s.replace('"    if (target.HighPrecision)\\n        return VioGpuFlipTargetHighPrecision;\\n"','"    if (target.HighPrecision)\\n    {\\n        return VioGpuFlipTargetHighPrecision;\\n    }\\n"')
          s=s.replace('def ungate(text, marker):','def ungate(text, marker, scope=None):')
          s=s.replace('    matches = anchor_matches(text, marker)\n','    matches = anchor_matches(text, marker)\n    if scope is not None:\n        start = text.index(scope)\n        matches = [m for m in matches if m.start() >= start]\n')
          s=s.replace('ungate(t, "m_pHWDevice->RequestColorConnectionRefresh();")','ungate(t, "m_pHWDevice->RequestColorConnectionRefresh();", "NTSTATUS VioGpuDod::QueryChildRelations(")')
          p.write_text(s)
          PYCODE
      - name: Normalize existing VioGPU code with the repository formatter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-16
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re
          root = Path.cwd()
          files = [str(p) for p in Path('viogpu').rglob('*')
                   if p.suffix.lower() in ('.c', '.cc', '.cpp', '.cxx', '.h', '.hh', '.hpp', '.hxx')
                   and not p.name.endswith('trace.h')]
          files += ['.install_scripts/viogpud3d-interpose.c']
          # Function-generating macro invocations need blank separators to avoid
          # clang-format 16 joining them differently on every successive run.
          interposer = Path('.install_scripts/viogpud3d-interpose.c')
          original = interposer.read_text()
          separated, count = re.subn(r'\b(DEFINE_(?:DXGI_)?STUB\(\d+\))', r'\1\n\n', original)
          assert count == 40, 'Unexpected generated macro blocks'
          assert re.sub(r'\s+', '', original) == re.sub(r'\s+', '', separated)
          interposer.write_text(separated)
          for attempt in range(3):
              before = [Path(p).read_bytes() for p in files]
              subprocess.run(['clang-format-16', '--style=file:' + str(root / '.clang-format'), '-i', *files], check=True)
              if before == [Path(p).read_bytes() for p in files]:
                  break
          PY
          git diff --check
          bash Tools/clang-format-helper.sh check . '' './VirtIO|./.*/.*trace.h|./NetKVM/Common/virtio_net.h|./NetKVM/linux/if_ether.h|./viofs/shared/fuse.h|./viofs/svc/scope_exit.h' > /tmp/video-format.log 2>&1 || { grep 'not formatted correctly' /tmp/video-format.log; tail -160 /tmp/video-format.log; exit 1; }
          bash Tools/clang-format-helper.sh check VirtIO '' '' >> /tmp/video-format.log 2>&1 || { grep 'not formatted correctly' /tmp/video-format.log; tail -160 /tmp/video-format.log; exit 1; }
      - name: Execute both actual workflow export gates and negative fixtures
        shell: pwsh
        run: ./viogpu/tests/video/binary-export-contract.ps1
      - name: Validate production contracts and regressions
        shell: bash
        run: |
          set -euo pipefail
          for t in wire state; do
            g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined viogpu/tests/video/${t}_test.cpp -o /tmp/video_${t}
            /tmp/video_${t}
          done
          python3 viogpu/tests/video/canonical_string_contract_test.py
          python3 viogpu/tests/video/no_pool_dependency_test.py
          python3 viogpu/tests/advanced-color-contract/run.py
          python3 viogpu/tests/video/export_contract_test.py
          python3 viogpu/tests/submit-perf/run.py
          python3 viogpu/tests/present-formats/run.py
          python3 viogpu/tests/vidpn-commit/run.py
          python3 viogpu/tests/fault-recovery/run.py
          python3 viogpu/tests/power-recovery/run.py
      - name: Create unattached reviewed Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile
          p = Path('.github/scripts/prepare-video-branch-ci.py')
          source = p.read_text()
          old = 'check=True, timeout=120)\n        return json.loads(result.stdout)'
          new = ('check=False, timeout=120)\n'
                 '        if result.returncode:\n'
                 '            print(result.stderr, file=sys.stderr)\n'
                 '            print(result.stdout, file=sys.stderr)\n'
                 '            raise RuntimeError("Git object API failed: " + endpoint)\n'
                 '        return json.loads(result.stdout)')
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '            element["content"] = path.read_text(encoding="utf-8")'
          new = '            element["sha"] = api("git/blobs", {"content": path.read_text(encoding="utf-8"), "encoding": "utf-8"})["sha"]'
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '    tree = api("git/trees", {"base_tree": base, "tree": elements})["sha"]'
          new = ('    payload = {"base_tree": base, "tree": elements}\n'
                 '    (ROOT / "video-ci-tree.json").write_text(json.dumps(payload, indent=2) + "\\n")\n'
                 '    tree = api("git/trees", payload)["sha"]')
          assert source.count(old) == 1
          p.write_text(source.replace(old, new))
          # Preserve the verified inputs even if GitHub's object API refuses a write.
          paths = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()
          with zipfile.ZipFile('video-ci-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  archive.write(name, name)
              archive.writestr('BASE_COMMIT', subprocess.check_output(['git','rev-parse','HEAD'], text=True))
          PY
          python3 .github/scripts/prepare-video-branch-ci.py --publish-objects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-ci-candidate
          path: |
            video-ci-candidate.json
            video-ci-tree.json
            video-ci-source.zip
          if-no-files-found: error
