name: VioGPU video no-pool ARM64
on:
  workflow_dispatch:
  push:
    branches: [work/vpu-video-umd-perf-20260915]
    paths: ['viogpu/video/**', 'viogpu/viogpuvideo/**', 'viogpu/viogpud3d/**', 'viogpu/tests/video/**', 'viogpu/viogpuwddm/check-contract.py', '.github/workflows/viogpu-video-ci.yml']
  pull_request:
    paths: ['viogpu/video/**', 'viogpu/viogpuvideo/**', 'viogpu/viogpud3d/**', 'viogpu/tests/video/**', 'viogpu/viogpuwddm/check-contract.py', '.github/workflows/viogpu-video-ci.yml']
permissions:
  contents: read
concurrency:
  group: video-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  wire-and-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute production wire/state helpers
        run: |
          set -eux
          for t in wire state; do
            g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined viogpu/tests/video/${t}_test.cpp -o /tmp/video_${t}
            /tmp/video_${t}
          done
      - name: Check video transport has no restricted-pool or GPU commandq dependency
        run: python3 viogpu/tests/video/no_pool_dependency_test.py
      - name: Exercise the WDDM contract and reject missing or unknown exports
        run: python3 viogpu/tests/video/export_contract_test.py
  arm64-build:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Locate WDK and SDK
        shell: pwsh
        run: ./.github/scripts/locate-windows-kit.ps1
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: arm64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Build the integrated VioGPU UMD and media driver
        shell: pwsh
        run: ./viogpu/video/build-video.ps1
      - name: Compile the hardware acceptance client without executing device operations
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX viogpu\tests\video\codec_probe.cpp viogpu\viogpuwddm\objfre_win11_arm64\arm64\viogpud3d.lib /Fe:video-codec-test.exe
          if errorlevel 1 exit /b 1
      - name: Upload unsigned review build and test client
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-video-arm64-review
          path: |
            viogpu/viogpuvideo/objfre_win11_arm64/arm64/*.sys
            viogpu/viogpuvideo/objfre_win11_arm64/arm64/*.inf
            viogpu/viogpuvideo/objfre_win11_arm64/arm64/*.cat
            viogpu/viogpuwddm/objfre_win11_arm64/arm64/viogpud3d.dll
            video-codec-test.exe
          if-no-files-found: error
