name: Build and validate system OpenGL ICD
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [viogpu-opengl-icd-20260911, viogpu-opengl-integrated-20260911, viogpu-opengl-installer-file-20260911, viogpu-opengl-discovery-20260911, viogpu-opengl-surface-20260911, viogpu-opengl-wddm12-recovery-20260911, work/opengl-small-stack-20260912, work/gles2-diagnostic-20260912]
permissions:
  contents: read
  actions: read
jobs:
  mesa-opengl:
    name: Build Mesa OpenGL/GLES (${{ matrix.arch }}) from submodule
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            msvc: x64_arm64
            triple: aarch64
            family: aarch64
            cmake: ARM64
          - arch: x64
            msvc: x64
            triple: x86_64
            family: x86_64
            cmake: x64
          - arch: x86
            msvc: x64_x86
            triple: i686
            family: x86
            cmake: Win32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      # The build and staging scripts live in the Mesa submodule.  Keep the
      # loader sources beside that checkout because the scripts record and
      # verify this exact relative path.
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Loader
          ref: vulkan-sdk-1.4.304.0
          path: external/mesa/external/vulkan-loader
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: vulkan-sdk-1.4.304.0
          path: external/mesa/external/vulkan-headers
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Mesa build generators
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'meson==1.9.1' mako packaging pyyaml ninja
          if ($LASTEXITCODE) { throw 'Mesa Python build tools failed' }
          choco install winflexbison3 --yes --no-progress
          if ($LASTEXITCODE) { throw 'WinFlexBison failed' }
          $flex = Get-ChildItem C:\ProgramData\chocolatey\lib -Recurse -Filter win_flex.exe | Select-Object -First 1
          if (!$flex) { throw 'Missing win_flex.exe' }
          Add-Content $env:GITHUB_PATH $flex.DirectoryName
      - name: Prepare host shader compiler
        shell: pwsh
        run: |
          $version = '16.6.0'
          $digest = '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b'
          $archive = Join-Path $env:RUNNER_TEMP 'glslang-host.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'glslang-host'
          $url = "https://github.com/KhronosGroup/glslang/releases/download/$version/glslang-$version-windows-x86_64-release.zip"
          curl.exe --fail --location --retry 2 --connect-timeout 20 --max-time 120 --output $archive $url
          if ($LASTEXITCODE) { throw 'Host glslang download failed' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) {
            throw 'Host glslang archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $programs = @(Get-ChildItem -LiteralPath $directory -Recurse -File -Filter glslangValidator.exe)
          if ($programs.Count -eq 0) {
            $programs = @(Get-ChildItem -LiteralPath $directory -Recurse -File -Filter glslang.exe)
            if ($programs.Count -ne 1) { throw 'Expected one host glslang executable' }
            Copy-Item -LiteralPath $programs[0].FullName -Destination (Join-Path $programs[0].DirectoryName 'glslangValidator.exe')
            $programs = @(Get-ChildItem -LiteralPath $directory -Recurse -File -Filter glslangValidator.exe)
          }
          if ($programs.Count -ne 1) { throw 'Expected one host glslangValidator.exe' }
          $shaderPath = $programs[0].FullName
          & $shaderPath --version
          if ($LASTEXITCODE) { throw 'Host shader compiler execution failed' }
          Add-Content $env:GITHUB_PATH (Split-Path -Parent $shaderPath)
      - name: Build and stage Mesa candidate from the submodule
        shell: pwsh
        working-directory: external/mesa
        run: |
          $cross = Join-Path $env:RUNNER_TEMP 'opengl-cross.ini'
          @(
            '[binaries]'
            "c = ['clang-cl', '--target=${{ matrix.triple }}-pc-windows-msvc']"
            "cpp = ['clang-cl', '--target=${{ matrix.triple }}-pc-windows-msvc']"
            "ar = 'llvm-lib'"
            '[host_machine]'
            "system = 'windows'"
            "cpu_family = '${{ matrix.family }}'"
            "cpu = '${{ matrix.family }}'"
            "endian = 'little'"
            '[properties]'
            'needs_exe_wrapper = true'
            '[built-in options]'
            "c_link_args = ['/DEBUG']"
            "cpp_link_args = ['/DEBUG']"
          ) | Set-Content $cross -Encoding ascii
          meson setup gl-build . --cross-file $cross --backend=ninja `
            --buildtype=debugoptimized -Doptimization=3 -Db_ndebug=true `
            -Dplatforms=windows -Dvulkan-drivers=freedreno -Dfreedreno-kmds=wddm `
            -Dgallium-drivers=zink -Dopengl=true -Dgles1=enabled -Dgles2=enabled `
            -Degl=enabled -Dglx=disabled -Dgbm=disabled -Dllvm=disabled `
            -Dshader-cache=disabled -Dzlib=enabled -Dzlib:default_library=static -Dzstd=disabled `
            -Dwindows-private-gl-arch='${{ matrix.arch }}' `
            -Db_vscrt=static_from_buildtype '-Dtools=[]' -Dbuild-tests=false -Dwerror=false
          if ($LASTEXITCODE) { throw 'Mesa submodule configuration failed' }
          meson compile -C gl-build
          if ($LASTEXITCODE) { throw 'Mesa submodule OpenGL/GLES compile failed' }
          ./bin/configure-private-vulkan-loader.ps1 -Architecture '${{ matrix.arch }}' -Source external/vulkan-loader
          if ($LASTEXITCODE) { throw 'Vulkan loader source configuration failed' }
          cmake -S external/vulkan-headers -B loader-headers -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP/vulkan-headers"
          if ($LASTEXITCODE) { throw 'Vulkan headers configuration failed' }
          cmake --install loader-headers
          if ($LASTEXITCODE) { throw 'Vulkan headers install failed' }
          cmake -S external/vulkan-loader -B loader-build -A '${{ matrix.cmake }}' `
            -DVULKAN_HEADERS_INSTALL_DIR="$env:RUNNER_TEMP/vulkan-headers" `
            -DBUILD_TESTS=OFF -DUSE_MASM=OFF -DUSE_GAS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { throw 'Vulkan loader configuration failed' }
          cmake --build loader-build --config Release --parallel
          if ($LASTEXITCODE) { throw 'Vulkan loader build failed' }
          ./bin/stage-windows-opengl.ps1 -Architecture '${{ matrix.arch }}' -Build gl-build -LoaderBuild loader-build -Stage opengl-candidate
          if ($LASTEXITCODE) { throw 'Mesa submodule candidate staging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-opengl-${{ matrix.arch }}
          path: external/mesa/opengl-candidate/
          if-no-files-found: error

  package:
    needs: mesa-opengl
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Parse flat build and validation scripts
        shell: pwsh
        run: |
          $scripts = @('viogpu/opengl/build-proxy.ps1', 'viogpu/opengl/build-small-stack-control.ps1', 'viogpu/opengl/test-flat-runtime.ps1')
          foreach ($script in $scripts) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "PowerShell parse failure: $script $errors" }
          }
      - uses: actions/download-artifact@v4
        with:
          name: mesa-opengl-arm64
          path: mesa-opengl-arm64
      - uses: actions/download-artifact@v4
        with:
          name: mesa-opengl-x64
          path: mesa-opengl-x64
      - uses: actions/download-artifact@v4
        with:
          name: mesa-opengl-x86
          path: mesa-opengl-x86
      - name: Collect and verify Mesa candidates built from the checked-out submodule
        shell: pwsh
        run: |
          $mesa = (git -C external/mesa rev-parse HEAD).Trim()
          $gitlink = (git rev-parse HEAD:external/mesa).Trim()
          if ($mesa -ne $gitlink) { throw "Mesa submodule checkout $mesa does not match parent gitlink $gitlink" }
          New-Item -ItemType Directory -Force mesa-opengl-artifacts | Out-Null
          foreach ($arch in @('arm64','x64','x86')) {
            $source = "mesa-opengl-$arch"
            $destination = "mesa-opengl-artifacts/opengl-zink-$arch-candidate"
            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item "$source/*" $destination -Recurse -Force
            $recorded = (Get-Content "$destination/source-commit.txt" -Raw).Trim()
            if ($recorded -ne $mesa) { throw "$arch Mesa candidate source $recorded does not match submodule $mesa" }
          }
          python viogpu/opengl/package.py --payloads mesa-opengl-artifacts --verify-only
          if ($LASTEXITCODE) { throw 'Mesa submodule source/hash/PE/export verification failed' }
      - name: Build real architecture proxies and ARM64X dual-view ICD
        shell: pwsh
        run: |
          ./viogpu/opengl/build-proxy.ps1
          ./viogpu/opengl/build-gles-probe.ps1 -Output opengl-system
      - name: Assemble system ICD package without an opengl32 replacement
        shell: pwsh
        run: |
          python viogpu/opengl/package.py --payloads mesa-opengl-artifacts --proxies opengl-system --output opengl-payload
          if ($LASTEXITCODE) { throw 'System ICD package verification failed' }
      - name: Reproduce original automatic path-storage failure with current flat dependencies
        shell: pwsh
        run: |
          ./viogpu/opengl/build-small-stack-control.ps1 -Output opengl-legacy
      - uses: actions/upload-artifact@v4
        with:
          name: viogpu-opengl-system-unsigned
          path: opengl-payload/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: viogpu-opengl-small-stack-negative-control
          path: |
            opengl-legacy/viogpuopengl.dll
            opengl-legacy/viogpuopengl_x86.dll
          if-no-files-found: error
  native-abi:
    needs: package
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: viogpu-opengl-system-unsigned
          path: opengl-payload
      - uses: actions/download-artifact@v4
        with:
          name: viogpu-opengl-small-stack-negative-control
          path: opengl-legacy-proxies
      - name: Verify real ICD exports on constrained worker stacks against automatic-storage control
        shell: pwsh
        run: |
          $root = (Resolve-Path opengl-payload).Path
          $legacy = Join-Path $env:RUNNER_TEMP 'opengl-legacy-payload'
          Copy-Item -LiteralPath $root -Destination $legacy -Recurse
          Copy-Item opengl-legacy-proxies/viogpuopengl*.dll -Destination $legacy -Force
          foreach ($arch in @('arm64','x64','x86')) {
            $dll = if ($arch -eq 'x86') { 'viogpuopengl_x86.dll' } else { 'viogpuopengl.dll' }
            foreach ($mode in @('--vulkan','--opengl')) {
              $probe = Join-Path $root "small-stack-probe-$arch.exe"
              $legacyIcd = Join-Path $legacy $dll
              $negative = Start-Process -FilePath $probe -ArgumentList @($mode, ('"{0}"' -f $legacyIcd)) -NoNewWindow -Wait -PassThru
              if ($negative.ExitCode -ne -1073741571) { throw "Pre-fix $arch $mode must reproduce STATUS_STACK_OVERFLOW, got $($negative.ExitCode)" }
              Write-Host "PASS pre-fix $arch $mode reproduces STATUS_STACK_OVERFLOW"
              & $probe $mode (Join-Path $root $dll)
              if ($LASTEXITCODE) { throw "Actual fixed $arch $mode 64 KiB stack regression failed" }
            }
          }
      - name: Execute ARM64X native and x64 views plus x86 Wow ABI
        shell: pwsh
        run: |
          $root = (Resolve-Path opengl-payload).Path
          foreach ($arch in @('arm64','x64','x86')) {
            & "$root/system-probe-$arch.exe" --load-only $root
            if ($LASTEXITCODE) { throw "Actual $arch ICD forwarding/load failed" }
            & "$root/gles-probe-$arch.exe" --load-only $root
            if ($LASTEXITCODE) { throw "Actual $arch EGL/GLES load failed" }
          }
          $isolated = Join-Path $env:RUNNER_TEMP 'opengl-probes-only'
          New-Item -ItemType Directory $isolated | Out-Null
          Copy-Item "$root/system-probe-*.exe" -Destination $isolated
          Push-Location $isolated
          try {
            foreach ($arch in @('arm64','x64','x86')) {
              & "$isolated/system-probe-$arch.exe" --load-default $root
              if ($LASTEXITCODE) { throw "Default DLL search from external $arch probe failed" }
            }
          } finally { Pop-Location }
          Write-Host 'No adapter registration or graphics context: ABI proof only, system rendering still requires target validation.'
      - name: Reject missing, wrong-architecture and foreign-package dependencies
        shell: pwsh
        run: ./viogpu/opengl/test-flat-runtime.ps1 -Payload opengl-payload
