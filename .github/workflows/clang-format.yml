name: clang-format check
# Manual only. This is the upstream virtio-win style gate, and it is red across
# the whole repository independently of anything this fork changes -- so on
# every push it reported a failure that no commit here could clear and that no
# commit here caused, which is worse than no signal: a red mark that never goes
# green stops being read, including on the runs that matter.
#
# Kept rather than deleted so it still runs on demand (Actions -> Run workflow)
# and so a future merge from upstream sees a file, not a hole.
on: workflow_dispatch

jobs:
  clang-format:
    name: Code style check for ${{ matrix.path['check'] }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        path:
          - check: '.'
            exclude: './VirtIO|./.*/.*trace.h|./NetKVM/Common/virtio_net.h|./NetKVM/linux/if_ether.h|./viofs/shared/fuse.h|./viofs/svc/scope_exit.h'
          - check: 'VirtIO'
            exclude: ''

    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format style check for C/C++ programs.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-16
          bash Tools/clang-format-helper.sh check ${CHECK_PATH} "" ${EXCLUDE_REGEX}
        env:
          CHECK_PATH: ${{ matrix.path['check'] }}
          EXCLUDE_REGEX: ${{ matrix.path['exclude'] }}
